# The acceptance suite (CUJ-5). Run it with the virtualenv that carries the
# browser:  .venv-acceptance/bin/behave
#
# Not part of `python3 -m unittest discover` or `gemdb run_db_tests.py`: those
# need neither a browser nor a running server, and this needs both.
[behave]
show_timings = true
stdout_capture = false
stderr_capture = false
log_capture = false
