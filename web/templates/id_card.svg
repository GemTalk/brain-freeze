{#- The ID card's whole design: card.html shows it, "Download image" and
    "Share" draw it to a PNG, and /policies/<id>/card.svg serves it alone.
    It is the GemDB brand guidelines' "Insurance Cards": the lockup, the plan
    as the headline, and the fields set between rules.

    It reads the `card` fields pages.id_card() provides and `style`, the
    colourway's name; the colourways themselves are in _brand.html. Colour
    comes only through the --bf-* custom properties on the root, so the card
    page can recolour it without asking the server.

    1200 x 640 is close to the 1.91:1 that X, LinkedIn, Bluesky and Threads
    show a shared image at uncropped. Keep every element inside it.

    The fonts are web fonts. The card page inlines them before it draws the
    PNG, because an SVG drawn onto a canvas cannot fetch anything; opened on
    its own, the @import below fetches them. -#}
{%- import "_brand.html" as brand with context -%}
{%- set way = brand.colorway_for(style, card.plan) -%}
{%- set name_size = 30 if card.subscriber|length <= 16 else (30 * 16 / card.subscriber|length)|round(1) -%}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"
  width="1200" height="640" role="img" data-colorway="{{ way }}"
  style="{{ brand.colorway_vars(way) }}"
  aria-label="{{ brand.name }} ID card for policy {{ card.policy_id }}">
<style>
@import url("{{ brand.fonts_url }}");
.bfc-bg { fill: var(--bf-bg, #0F9EE1); }
.bfc-ink { fill: var(--bf-ink, #F2F5F4); }
.bfc-rule { stroke: var(--bf-ink, #F2F5F4); stroke-width: 3; }
.bfc-s1 { fill: var(--bf-s1, #F2F5F4); }
.bfc-s2 { fill: var(--bf-s2, #F2F5F4); }
.bfc-s3 { fill: var(--bf-s3, #F2F5F4); }
.bfc-sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.bfc-label { font-size: 26px; font-weight: 400; }
.bfc-value { font-size: 30px; font-weight: 500; }
</style>
<rect class="bfc-bg" width="1200" height="640"/>

<g transform="translate(54 27) scale(.625)">
{{ brand.lockup_shapes("bfc-s1", "bfc-s2", "bfc-s3", "bfc-ink", attr="class") }}
</g>

<text class="bfc-ink bfc-sans" x="470" y="134" font-size="96" font-weight="600"
      letter-spacing="-3">{{ card.plan }} Plan</text>

<g class="bfc-rule">
  <line x1="51" y1="190" x2="391" y2="190"/>
  <line x1="470" y1="190" x2="1146" y2="190"/>
  <line x1="51" y1="408" x2="391" y2="408"/>
  <line x1="470" y1="408" x2="1146" y2="408"/>
  <line x1="51" y1="552" x2="391" y2="552"/>
  <line x1="470" y1="552" x2="1146" y2="552"/>
</g>

<g class="bfc-ink bfc-sans">
  <text class="bfc-label" x="64" y="252">Subscriber Name</text>
  <text class="bfc-value" x="64" y="296" id="bfc-subscriber"
        style="font-size:{{ name_size }}px">{{ card.subscriber|upper }}</text>
  <text class="bfc-label" x="64" y="347">Identification Number</text>
  <text class="bfc-value" x="64" y="389">{{ card.policy_id }}</text>
  <text class="bfc-label" x="64" y="452">Annual Premium</text>
  <text class="bfc-value" x="64" y="497">{{ card.premium }}</text>

  <text class="bfc-label" x="499" y="252">Coverage Period<tspan font-size="20" dx="14" opacity=".8">{{ card.status|upper }}</tspan></text>
  <text class="bfc-value" x="499" y="296">{{ card.valid_from }} TO {{ card.valid_to }}</text>
  <text class="bfc-label" x="499" y="347">Scoop Amount Coverage</text>
  <text class="bfc-value" x="499" y="389">{{ card.cover }} AN EPISODE, {{ card.deductible }} DEDUCTIBLE</text>
  <text class="bfc-label" x="499" y="452">Covered Within</text>
  <text class="bfc-value" x="499" y="497">ANYWHERE SERVING THE COLD STUFF</text>

  <text x="59" y="616" font-size="27" font-weight="800" letter-spacing="-.5">GemDB</text>
  <text x="205" y="596" font-size="13">Your Code is the Schema.</text>
  <text x="205" y="614" font-size="13">The Database That Humans and Agents Love to Change</text>
  <text x="1146" y="614" font-size="13" text-anchor="end">Fictional. This is not real insurance.</text>
</g>
</svg>
